name: test

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'info.yaml'
      - '.github/workflows/test.yaml'

  workflow_run:
    workflows: ["macros"]
    types:
      - completed

  workflow_dispatch:

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive  
          
      # 🔍 1. EXTRACT RUN ID (Handles manual buttons natively)
      - name: Resolve Macro Run ID
        id: resolve-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          else
            # Finds the absolute latest successful macros workflow run ID natively via GitHub CLI
            LATEST_ID=$(gh run list --workflow="macros.yaml" --status=success --limit=1 --json databaseId -q '.[0].databaseId')
            echo "run_id=$LATEST_ID" >> $GITHUB_OUTPUT
          fi

        # 📦 2. SAFE GITHUB ARTIFACT DOWNLOADER (Bypasses v4 run-id 404 bugs)
      - name: Download Precompiled Macro Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.resolve-id.outputs.run_id }}
        run: |
          echo "Checking for macro artifacts in run: $RUN_ID..."
          
          # Attempt to download the artifact via GitHub CLI; suppress 404 failure code
          if gh run download "$RUN_ID" --name precompiled-macros --dir macros/ 2>/dev/null; then
            echo "Successfully loaded precompiled macros."
          else
            echo "No macros directory found."
            exit -1
            #echo "No precompiled macros found or run doesn't exist yet. Creating empty layout placeholder."
            # Touch a dummy file so the build flow downstream doesn't stall on a completely empty folder
            #touch macros/.placeholder
          fi

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt
  
      - name: Fetch and Link PDK dev Branch Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail

          # 1. Define clean workspace target directory variables
          export TARGET_PDK_DIR="${{ github.workspace }}/pdk"
          export TEMP_CLONE_DIR="${{ github.workspace }}/pdk_tmp"
          
          rm -rf "$TARGET_PDK_DIR" "$TEMP_CLONE_DIR"
          mkdir -p "$TARGET_PDK_DIR"
          
          echo "📥 Performing native source clone..."
          # 2. Clone the full repository structure to a temporary folder
          git clone --branch main --depth 1 --recurse-submodules https://github.com/google/gf180mcu-pdk.git "$TEMP_CLONE_DIR"
    
          echo "📁 Moving internal process folders to match expected tool layout..."
          # 3. Explicitly create the parent directory structure and move targets
          mkdir -p "$TARGET_PDK_DIR/gf180mcuD/libs.ref"
    
          mv "$TEMP_CLONE_DIR/libraries/gf180mcu_fd_pr/latest" "$TARGET_PDK_DIR/gf180mcuD/libs.ref/gf180mcu_fd_pr"
          mv "$TEMP_CLONE_DIR/libraries/gf180mcu_fd_sc_mcu7t5v0/latest" "$TARGET_PDK_DIR/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0"
          mv "$TEMP_CLONE_DIR/libraries/gf180mcu_fd_sc_mcu9t5v0/latest" "$TARGET_PDK_DIR/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu9t5v0"
          mv "$TEMP_CLONE_DIR/libraries/gf180mcu_fd_io/latest" "$TARGET_PDK_DIR/gf180mcuD/libs.ref/gf180mcu_fd_io"
    
          # 4. Clean up the empty temporary download directory
          rm -rf "$TEMP_CLONE_DIR"
          
          # 5. Export environment tracking configurations
          echo "PDK_ROOT=$TARGET_PDK_DIR" >> $GITHUB_ENV
          echo "PDK=gf180mcuD" >> $GITHUB_ENV

      - name: Run tests
        run: |
          # Explicitly force the path back to the actual system PDK install location
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*